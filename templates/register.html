<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Stockroom</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="auth-page"><main class="auth-card"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">S</span><span>Stockroom</span></a><p class="eyebrow">Get started</p><h1>Make space for clarity.</h1><p class="muted">Create your account and bring your inventory into focus.</p>{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}<form class="auth-form" action="{{ url_for('register') }}" method="post"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" name="password" minlength="6" autocomplete="new-password" required></div><button class="button" type="submit">Create account <span>-></span></button></form><p class="auth-foot">After registration, you will be redirected to <a href="{{ url_for('login') }}">sign in</a>.</p></main></body></html>
