{% extends "base.html" %}
{% block title %}Add supplier{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">Partners</p><h1>Add supplier</h1><p class="muted">Keep contact details close when you need to restock.</p></div></div><section class="form-panel">{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}<form method="post"><div class="form-grid"><div class="field full"><label for="name">Supplier name</label><input id="name" name="name" required></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone"></div><div class="field"><label for="email">Email</label><input id="email" type="email" name="email"></div></div><div class="form-actions"><button class="button" type="submit">Save supplier</button><a class="button secondary" href="{{ url_for('suppliers') }}">Cancel</a></div></form></section>{% endblock %}
