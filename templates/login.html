<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Stockroom</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="auth-page"><main class="auth-card"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">S</span><span>Stockroom</span></a><p class="eyebrow">Inventory control</p><h1>Welcome back.</h1><p class="muted">Sign in to keep your operation moving.</p>{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}<form class="auth-form" action="{{ url_for('login') }}" method="post"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" placeholder="Your username" required></div><div class="field"><label for="password">Password</label><div class="password-box"><input id="password" type="password" name="password" autocomplete="current-password" placeholder="Your password" required><button class="show-password" type="button" onclick="togglePassword()">Show</button></div></div><button class="button" type="submit">Sign in <span>-></span></button></form><p class="auth-foot">New to Stockroom? <a href="{{ url_for('register') }}">Create an account</a></p></main><script>function togglePassword(){const input=document.getElementById('password');const button=document.querySelector('.show-password');const visible=input.type==='password';input.type=visible?'text':'password';button.textContent=visible?'Hide':'Show';}</script></body></html>
