{% extends "base.html" %}
{% block title %}Add product{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">Catalog</p><h1>Add product</h1><p class="muted">Give your team a clear record of a new item.</p></div></div><section class="form-panel">{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}<form method="post"><div class="form-grid"><div class="field full"><label for="name">Product name</label><input id="name" name="name" value="{{ product.name if product else '' }}" required></div><div class="field"><label for="category">Category</label><input id="category" name="category" value="{{ product.category if product else '' }}"></div><div class="field"><label for="price">Price</label><input id="price" type="number" name="price" min="0" step="0.01" required></div><div class="field"><label for="quantity">Quantity</label><input id="quantity" type="number" name="quantity" min="0" required></div></div><div class="form-actions"><button class="button" type="submit">Save product</button><a class="button secondary" href="{{ url_for('products') }}">Cancel</a></div></form></section>{% endblock %}
